name: modulix
description: Modulix – Advanced NEET-PG Study Planner
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^14.2.7

  # Persistence
  shared_preferences: ^2.3.2

  # Supabase Backend & Auth
  supabase_flutter: ^2.8.0
  google_sign_in: ^6.2.2

  # Charts
  fl_chart: ^0.69.0

  # File I/O & sharing
  file_picker: ^8.1.2
  share_plus: ^10.0.2
  path_provider: ^2.1.4

  # SVG
  flutter_svg: ^2.0.10+1

  # Animations
  lottie: ^3.1.2

  # Utilities
  intl: ^0.19.0
  collection: ^1.18.0
  # UI Component Catalog (Storybook)
  widgetbook: ^3.8.0
  audioplayers: ^6.8.1
  rive: ^0.14.11
  # Notifications
  flutter_local_notifications: ^17.2.2
  timezone: ^0.9.4
  flutter_timezone: ^5.1.0
  video_player: ^2.14.0
  wakelock_plus: ^1.5.2
  sqflite: ^2.4.4+1
  path: ^1.9.1
  firebase_core: ^4.15.0
  firebase_analytics: ^12.6.0
  firebase_crashlytics: ^5.4.0
  flutter_animate: ^4.5.2
  sprung: ^3.0.1
  sliver_tools: ^0.2.12

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.12
  riverpod_generator: ^2.4.3
  sqflite_common_ffi: ^2.4.3

flutter:
  uses-material-design: true
  assets:
    - assets/illustrations/
    - assets/icons/
    - assets/icons/navbar/
    - assets/icons/subjects/
    - assets/audio/
    - assets/images/
    - assets/avatars/
    - assets/rive/
    - assets/sprites/73wgl0lx/sprites/
    - assets/sprites/nori/bored/
    - assets/sprites/nori/celebrating/
    - assets/sprites/nori/celebrating_alt/
    - assets/sprites/nori/eating/
    - assets/sprites/nori/excited/
    - assets/sprites/nori/love/
    - assets/sprites/nori/playful/
    - assets/sprites/nori/rolling_sleep/
    - assets/sprites/nori/running/
    - assets/sprites/nori/sad/
    - assets/sprites/nori/sleepy/
    - assets/sprites/nori/studying/
    - assets/sprites/nori/tired/
    - assets/sprites/nori/walking/
    - assets/sprites/nori/welcoming/
    - assets/sprites/nori/yawning_loaf/
    - assets/sprites/nori/transitions/bored_to_study/
    - assets/sprites/nori/transitions/bored_to_welcome/
    - assets/sprites/nori/transitions/celebrate_to_run/
    - assets/sprites/nori/transitions/celebrate_to_walk/
    - assets/sprites/nori/transitions/eat_to_play/
    - assets/sprites/nori/transitions/eat_to_sleep/
