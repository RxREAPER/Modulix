name: 🐛 Bug Report
description: Create a report to help us improve Modulix
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue!
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: Tell us what went wrong...
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Detailed steps to reproduce the behavior.
      placeholder: |
        1. Open 'Curriculum'
        2. Tap on 'Surgery'
        3. Scroll to Unit 3...
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device & OS
      description: e.g. OnePlus 13R (Android 15), Pixel 8 (Android 14)
      placeholder: OnePlus 13R, Android 15
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / Screenshots
      description: Paste any terminal logs or attach screenshots.
