name: 🚀 Feature Request
description: Suggest an idea or enhancement for Modulix
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or Clinical Need
      description: Is your feature request related to a specific exam preparation workflow?
      placeholder: As a medical student preparing for NEET-PG, I need...
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe what you would like to see happen.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternative Solutions Considered
      description: Any alternative solutions or features you've considered.
